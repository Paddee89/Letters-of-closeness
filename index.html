<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Open When</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top,#fff7ed,#fff1f2 40%,#fefce8);
  color:#44403c;
}

.container{
  max-width:900px;
  margin:auto;
  padding:60px 20px;
}

h1{
  font-family:Cormorant Garamond;
  text-align:center;
  font-size:3rem;
}

.subtitle{
  text-align:center;
  color:#78716c;
  margin-bottom:40px;
}

/* THEMES */
.theme{
  background:rgba(255,255,255,0.75);
  padding:18px;
  border-radius:18px;
  margin-bottom:12px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

/* VIEW */
#viewer{
  display:none;
  margin-top:30px;
}

.back{
  cursor:pointer;
  margin-bottom:20px;
  color:#78716c;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tab{
  padding:10px 14px;
  border-radius:999px;
  background:white;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.tab.active{
  background:#fde68a;
}

/* UPLOAD */
.upload{
  margin-bottom:20px;
}

.upload input{
  display:block;
  margin-top:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media(min-width:800px){
  .grid{ grid-template-columns:1fr 1fr; }
}

.item{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

.item img{
  width:100%;
  display:block;
}

</style>
</head>

<body>

<div class="container">

<h1>Open When</h1>
<div class="subtitle">
A small place for distance ✨
</div>

<div id="themes"></div>

<div id="viewer">

  <div class="back" onclick="closeViewer()">← Back</div>

  <div class="tabs">
    <div class="tab active" data-tab="nancy">For Nancy</div>
    <div class="tab" data-tab="patrick">For Patrick</div>
    <div class="tab" data-tab="both">For Both</div>
  </div>

  <div class="upload">
    <b>Upload memory:</b>
    <input type="file" id="fileInput" />
  </div>

  <div class="grid" id="grid"></div>

</div>

</div>

<script>

const CLOUD_NAME = "dsrolyylc";
const UPLOAD_PRESET = "openwhen";

const themes = [
  "missme",
  "lonely",
  "reassure",
  "sleep",
  "smile",
  "difficult"
];

let currentTheme = null;
let currentTab = "nancy";

/* STORAGE */
function key(){
  return `ow-${currentTheme}-${currentTab}`;
}

function load(){
  return JSON.parse(localStorage.getItem(key()) || "[]");
}

function save(data){
  localStorage.setItem(key(), JSON.stringify(data));
}

/* RENDER THEMES */
const themeContainer = document.getElementById("themes");

themes.forEach(t=>{

  const div = document.createElement("div");
  div.className="theme";
  div.innerText = "Open when " + t;

  div.onclick = ()=>openTheme(t);

  themeContainer.appendChild(div);

});

/* OPEN */
function openTheme(t){
  currentTheme = t;
  document.getElementById("viewer").style.display="block";
  render();
}

/* CLOSE */
function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

/* TABS */
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    render();
  };
});

/* RENDER */
function render(){

  const grid = document.getElementById("grid");
  grid.innerHTML="";

  load().forEach(url=>{

    const div = document.createElement("div");
    div.className="item";

    div.innerHTML = `<img src="${url}">`;

    grid.appendChild(div);

  });

}

/* UPLOAD TO CLOUDINARY */
document.getElementById("fileInput").addEventListener("change", async (e)=>{

  const file = e.target.files[0];

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method:"POST",
      body:form
    }
  );

  const data = await res.json();

  const urls = load();
  urls.push(data.secure_url);
  save(urls);

  render();

});

</script>

</body>
</html>
