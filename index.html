<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open When</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #fff1f2, #fffbeb, #fefce8);
      color: #44403c;
      overflow-x: hidden;
      position: relative;
    }

    .glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
    }

    .glow-1 { background: #fecdd3; top: -100px; left: -100px; }
    .glow-2 { background: #fde68a; bottom: -100px; right: -100px; }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      color: #57534e;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #78716c;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.8;
    }

    .letters {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .letter {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      transition: all 0.35s ease;
    }

    .letter:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.88);
    }

    details {
      transition: all 0.4s ease;
    }

    details[open] {
      animation: openLetter 0.35s ease;
    }

    @keyframes openLetter {
      from { opacity: 0.6; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .emoji {
      font-size: 1.8rem;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 500;
    }

    .open-text {
      font-size: 0.85rem;
      color: #a8a29e;
      font-style: italic;
    }

    .content {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(214, 211, 209, 0.6);
    }

    .letter-image {
      width: 100%;
      border-radius: 18px;
      margin-top: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.5s ease;
    }

    .letter-image.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .nav-button {
      border: none;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      color: #57534e;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }

    .nav-button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.95);
    }

    .nav-button:active {
      transform: scale(0.96);
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: #a8a29e;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .floating-heart {
      position: fixed;
      font-size: 14px;
      opacity: 0.15;
      animation: float 12s linear infinite;
      z-index: 0;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 0; }
      20% { opacity: 0.15; }
      to { transform: translateY(-120px); opacity: 0; }
    }

    /* 🌿 MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {
      .container {
        padding: 60px 14px;
      }

      h1 {
        font-size: 3rem;
      }

      .letter {
        padding: 20px;
      }

      .title {
        font-size: 1.1rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .controls {
        flex-direction: column;
      }

      .nav-button {
        width: 100%;
      }
    }

    @media (min-width: 1200px) {
      .container {
        max-width: 1000px;
      }
    }
  </style>
</head>

<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">

    <div class="hero">
      <h1>Open When</h1>
      <p class="subtitle">
        A small place for the moments when the distance feels harder.
      </p>
    </div>

    <section class="letters" id="letters-container"></section>

    <div class="footer">
      <p>Austria ↔ Costa Rica</p>
      <p>Distance changes nothing important ✨</p>
    </div>

  </div>

<script>
const letters = [
  { title:'Open when you miss me', emoji:'💌', images:['missme1.jpeg','missme2.jpeg'] },
  { title:'Open when you feel lonely', emoji:'🌙', images:['lonely1.jpeg','lonely2.jpeg'] },
  { title:'Open when you need reassurance', emoji:'🤍', images:['reassure1.jpeg','reassure2.jpeg'] },
  { title:'Open when you can’t sleep', emoji:'✨', images:['sleep1.jpeg','sleep2.jpeg'] },
  { title:'Open when you want to smile', emoji:'☀️', images:['smile1.jpeg','smile2.jpeg'] },
  { title:'Open when we have a difficult day', emoji:'🫶', images:['difficult1.jpeg','difficult2.jpeg'] }
];

const container = document.getElementById('letters-container');

function renderLetters() {

  container.innerHTML = '';

  letters.forEach((letter, i) => {

    let index = 0;

    const el = document.createElement('details');
    el.className = 'letter';

    el.innerHTML = `
      <summary>
        <div class="summary-left">
          <div class="emoji">${letter.emoji}</div>
          <div class="title">${letter.title}</div>
        </div>
        <div class="open-text">open gently ✨</div>
      </summary>

      <div class="content">
        <img class="letter-image" id="img-${i}" src="${letter.images[0]}">

        <div class="controls">
          <button class="nav-button" id="prev-${i}">← Previous</button>
          <button class="nav-button" id="next-${i}">Next →</button>
        </div>
      </div>
    `;

    container.appendChild(el);

    const img = document.getElementById(`img-${i}`);
    const prev = document.getElementById(`prev-${i}`);
    const next = document.getElementById(`next-${i}`);

    function update() {
      img.classList.remove('loaded');

      setTimeout(() => {
        img.src = letter.images[index];
      }, 120);

      img.onload = () => img.classList.add('loaded');

      prev.disabled = index === 0;
      next.disabled = index === letter.images.length - 1;
    }

    prev.onclick = () => {
      if(index > 0) index--;
      update();
    };

    next.onclick = () => {
      if(index < letter.images.length - 1) index++;
      update();
    };

    update();

    el.addEventListener('toggle', () => {
      if(el.open) {
        document.querySelectorAll('details').forEach(d => {
          if(d !== el) d.open = false;
        });
      }
    });

  });
}

renderLetters();

setInterval(() => {
  const h = document.createElement('div');
  h.className = 'floating-heart';
  h.innerHTML = '❤';
  h.style.left = Math.random()*100+'vw';
  h.style.animationDuration = (8+Math.random()*8)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),16000);
},1400);
</script>

</body>
</html>
