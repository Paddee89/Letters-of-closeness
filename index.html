<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open When</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #fff1f2, #fffbeb, #fefce8);
      color: #44403c;
      overflow-x: hidden;
      position: relative;
    }

    .glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
    }

    .glow-1 {
      background: #fecdd3;
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      background: #fde68a;
      bottom: -100px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(4rem, 10vw, 6rem);
      font-weight: 400;
      color: #57534e;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #78716c;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.8;
    }

    .letters {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .letter {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      padding: 28px;
      transition: all 0.35s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .letter:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.85);
    }

    details summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    details summary::-webkit-details-marker {
      display: none;
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .emoji {
      font-size: 2rem;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 500;
      color: #44403c;
    }

    .open-text {
      font-size: 0.9rem;
      color: #a8a29e;
      font-style: italic;
    }

    .content {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(214, 211, 209, 0.6);
      line-height: 2;
      color: #57534e;
      font-size: 1.05rem;
    }

    .nav-button {
      border: none;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      color: #57534e;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }

    .nav-button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.95);
    }

    .letter-image {
      width: 100%;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: #a8a29e;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .floating-heart {
      position: fixed;
      font-size: 14px;
      opacity: 0.15;
      animation: float 12s linear infinite;
      z-index: 0;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
        opacity: 0;
      }
      20% {
        opacity: 0.15;
      }
      to {
        transform: translateY(-120px);
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 60px 16px;
      }

      .letter {
        padding: 22px;
      }

      .title {
        font-size: 1.1rem;
      }

      .content {
        font-size: 1rem;
        line-height: 1.9;
      }
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">

    <section class="hero">
      <h1>Open When</h1>
      <p class="subtitle">
        A small place for the moments when the distance feels harder.
      </p>
    </section>

    <section class="letters" id="letters-container">
    </section>

    <div style="display:flex; justify-content:center; margin-top:40px; gap:16px;">
      <button id="prevBtn" class="nav-button">← Previous</button>
      <button id="nextBtn" class="nav-button">Next →</button>
    </div>

    <div class="footer">
      <p>Austria ↔ Costa Rica</p>
      <p>Distance changes nothing important ✨</p>
    </div>

  </div>

  <script>
    const letters = [
      {
        title: 'Open when you miss me',
        emoji: '💌',
        images: [
        'missme1.png',
        'missme2.png'
      ]
      },
      {
        title: 'Open when you feel lonely',
        emoji: '🌙',
        images: [
        'lonely1.png',
        'lonely2.png'
      ]
      },
      {
        title: 'Open when you need reassurance',
        emoji: '🤍',
        images: [
        'reassure1.png',
        'reassure2.png'
      ]
      },
      {
        title: 'Open when you can’t sleep',
        emoji: '✨',
        images: [
        'sleep1.png',
        'sleep2.png'
      ]
      },
      {
        title: 'Open when you want to smile',
        emoji: '☀️',
        images: [
        'smile1.png',
        'smile2.png'
      ]
      },
      {
        title: 'Open when we have a difficult day',
        emoji: '🫶',
        images: [
        'difficult1.png',
        'difficult2.png'
      ]
      }
    ];

    const lettersPerPage = 2;
    let currentPage = Math.floor((letters.length - 1) / lettersPerPage);

    const container = document.getElementById('letters-container');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderLetters() {
      container.innerHTML = '';

      const start = currentPage * lettersPerPage;
      const end = start + lettersPerPage;
      const visibleLetters = letters.slice(start, end);

      visibleLetters.forEach(letter => {
        const letterElement = document.createElement('details');
        letterElement.className = 'letter';

        letterElement.innerHTML = `
          <summary>
            <div class="summary-left">
              <div class="emoji">${letter.emoji}</div>
              <div class="title">${letter.title}</div>
            </div>
            <div class="open-text">open gently ✨</div>
          </summary>

          <img src="${letter.image}" alt="${letter.title}" class="letter-image">
        `;

        container.appendChild(letterElement);
      });

      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = end >= letters.length;

      prevBtn.style.opacity = currentPage === 0 ? '0.4' : '1';
      nextBtn.style.opacity = end >= letters.length ? '0.4' : '1';
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        renderLetters();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      if ((currentPage + 1) * lettersPerPage < letters.length) {
        currentPage++;
        renderLetters();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    renderLetters();

    const createHeart = () => {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerHTML = '❤';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (8 + Math.random() * 8) + 's';
      heart.style.fontSize = (10 + Math.random() * 12) + 'px';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 16000);
    };

    setInterval(createHeart, 1400);
  </script>

</body>
</html>
