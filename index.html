<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Open When</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #fff7ed, #fff1f2 40%, #fefce8);
  color:#44403c;
  overflow-x:hidden;
}

.layer {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.glow {
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  filter:blur(100px);
  opacity:0.25;
  animation:flicker 6s infinite ease-in-out;
}

.glow-1 { background:#fecdd3; top:-120px; left:-120px; }
.glow-2 { background:#fde68a; bottom:-120px; right:-120px; animation-delay:2s; }
.glow-3 { background:white; top:40%; left:50%; transform:translate(-50%,-50%); opacity:0.12; animation-delay:1s; }

@keyframes flicker {
  0%,100% { opacity:0.18; transform:scale(1); }
  50% { opacity:0.3; transform:scale(1.08); }
}

.container {
  position:relative;
  z-index:2;
  max-width:1000px;
  margin:0 auto;
  padding:80px 20px;
}

.hero {
  text-align:center;
  margin-bottom:60px;
}

h1 {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(3rem, 8vw, 6rem);
  font-weight:400;
}

.subtitle {
  margin-top:10px;
  color:#78716c;
}

.category-block {
  margin-bottom:70px;
}

.category-title {
  font-family:'Cormorant Garamond', serif;
  font-size:2rem;
  margin-bottom:20px;
}

.letters {
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

@media(min-width:900px){
  .letters { grid-template-columns:1fr 1fr; }
}

.letter {
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

summary {
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

summary::-webkit-details-marker { display:none; }

.summary-left {
  display:flex;
  gap:12px;
  align-items:center;
}

.emoji { font-size:1.6rem; }

.title { font-weight:500; }

.content {
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.letter-image {
  width:100%;
  border-radius:16px;
  margin-top:12px;
}

.controls {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.nav-button {
  padding:10px 16px;
  border:none;
  border-radius:999px;
  background:white;
  cursor:pointer;
}

.footer {
  text-align:center;
  margin-top:80px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="layer" id="layer1">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
</div>

<div class="layer" id="layer2">
  <div class="glow glow-3"></div>
</div>

<div class="container">

  <div class="hero">
    <h1>Open When</h1>
    <div class="subtitle">A small place for distance.</div>
  </div>

  <div class="category-block">
    <div class="letters" id="letters"></div>
  </div>

  <div class="footer">
    Austria ↔ Costa Rica ✨
  </div>

</div>

<script>

const themes = [
  {title:'Open when you miss me', emoji:'💌', key:'missme'},
  {title:'Open when you feel lonely', emoji:'🌙', key:'lonely'},
  {title:'Open when you need reassurance', emoji:'🤍', key:'reassure'},
  {title:'Open when you can’t sleep', emoji:'✨', key:'sleep'},
  {title:'Open when you want to smile', emoji:'☀️', key:'smile'},
  {title:'Open when we have a difficult day', emoji:'🫶', key:'difficult'}
];

function file(person,key){
  if(person==="nancy") return `${key}1.jpeg`;
  if(person==="patrick") return `nan${key}1.jpeg`;
  return `both${key}1.jpeg`;
}

function render(){

  const c=document.getElementById("letters");

  themes.forEach((t,i)=>{

    const el=document.createElement("details");
    el.className="letter";

    el.innerHTML=`
      <summary>
        <div class="summary-left">
          <div class="emoji">${t.emoji}</div>
          <div class="title">${t.title}</div>
        </div>
      </summary>

      <div class="content">

        <div id="step-${i}">
          <button onclick="choose(${i},'nancy')">For Nancy</button>
          <button onclick="choose(${i},'patrick')">For Patrick</button>
          <button onclick="choose(${i},'both')">For Both</button>
        </div>

        <img id="img-${i}" class="letter-image">

      </div>
    `;

    c.appendChild(el);
  });
}

function choose(i,person){
  const t=themes[i];
  document.getElementById(`img-${i}`).src=file(person,t.key);
}

render();

document.addEventListener('mousemove',(e)=>{
  const x=(e.clientX/window.innerWidth-0.5)*20;
  const y=(e.clientY/window.innerHeight-0.5)*20;

  document.getElementById('layer1').style.transform=`translate(${x}px,${y}px)`;
  document.getElementById('layer2').style.transform=`translate(${-x}px,${-y}px)`;
});

</script>

</body>
</html>
