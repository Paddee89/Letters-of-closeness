<script>
const categories = {

  nancy: [
    {
      title:'Open when you miss me',
      emoji:'💌',
      images:['missme1.jpeg','missme2.jpeg']
    },
    {
      title:'Open when you feel lonely',
      emoji:'🌙',
      images:['lonely1.jpeg','lonely2.jpeg']
    },
    {
      title:'Open when you need reassurance',
      emoji:'🤍',
      images:['reassure1.jpeg','reassure2.jpeg']
    },
    {
      title:'Open when you can’t sleep',
      emoji:'✨',
      images:['sleep1.jpeg','sleep2.jpeg']
    },
    {
      title:'Open when you want to smile',
      emoji:'☀️',
      images:['smile1.jpeg','smile2.jpeg']
    },
    {
      title:'Open when we have a difficult day',
      emoji:'🫶',
      images:['difficult1.jpeg','difficult2.jpeg']
    }
  ],

  patrick: [
    // Add Patrick letters here later
  ],

  both: [
    // Add shared letters here later
  ]

};

function renderCategory(containerId, letters) {

  const container = document.getElementById(containerId);

  container.innerHTML = '';

  letters.forEach((l, i) => {

    let idx = 0;

    const el = document.createElement('details');
    el.className = 'letter';

    el.innerHTML = `
      <summary>
        <div class="summary-left">
          <div class="emoji">${l.emoji}</div>
          <div class="title">${l.title}</div>
        </div>

        <div class="open-text">open gently ✨</div>
      </summary>

      <div class="content">

        <img 
          class="letter-image"
          id="${containerId}-img-${i}"
          src="${l.images[0]}"
        >

        <div class="controls">
          <button 
            class="nav-button"
            id="${containerId}-prev-${i}"
          >
            ←
          </button>

          <button 
            class="nav-button"
            id="${containerId}-next-${i}"
          >
            →
          </button>
        </div>

      </div>
    `;

    container.appendChild(el);

    const img = document.getElementById(`${containerId}-img-${i}`);
    const prev = document.getElementById(`${containerId}-prev-${i}`);
    const next = document.getElementById(`${containerId}-next-${i}`);

    function update() {

      img.classList.remove('loaded');

      setTimeout(() => {
        img.src = l.images[idx];
      }, 120);

      img.onload = () => {
        img.classList.add('loaded');
      };

      prev.disabled = idx === 0;
      next.disabled = idx === l.images.length - 1;

    }

    prev.onclick = () => {
      if(idx > 0) {
        idx--;
        update();
      }
    };

    next.onclick = () => {
      if(idx < l.images.length - 1) {
        idx++;
        update();
      }
    };

    update();

    el.addEventListener('toggle', () => {

      if(el.open) {

        document.querySelectorAll('details').forEach(d => {

          if(d !== el) {
            d.open = false;
          }

        });

      }

    });

  });

}

renderCategory('nancy-container', categories.nancy);
renderCategory('patrick-container', categories.patrick);
renderCategory('both-container', categories.both);

/* 🌿 PARALLAX */
document.addEventListener('mousemove', (e) => {

  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 20;

  document.getElementById('layer1').style.transform =
    `translate(${x}px, ${y}px)`;

  document.getElementById('layer2').style.transform =
    `translate(${-x}px, ${-y}px)`;

});
</script>
