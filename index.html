<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Open When</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #fff7ed, #fff1f2 40%, #fefce8);
  color:#44403c;
  overflow-x:hidden;
}

/* BACKGROUND */
.layer {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.glow {
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  filter:blur(100px);
  opacity:0.25;
  animation:flicker 6s infinite ease-in-out;
}

.glow-1 { background:#fecdd3; top:-120px; left:-120px; }
.glow-2 { background:#fde68a; bottom:-120px; right:-120px; animation-delay:2s; }

@keyframes flicker {
  0%,100% { opacity:0.18; transform:scale(1); }
  50% { opacity:0.3; transform:scale(1.08); }
}

.container {
  position:relative;
  z-index:2;
  max-width:1000px;
  margin:0 auto;
  padding:80px 20px;
}

.hero {
  text-align:center;
  margin-bottom:60px;
}

h1 {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(3rem, 8vw, 6rem);
  font-weight:400;
}

.subtitle {
  margin-top:10px;
  color:#78716c;
}

/* THEME */
.theme {
  margin-bottom:80px;
}

.theme-title {
  font-family:'Cormorant Garamond', serif;
  font-size:2.2rem;
  margin-bottom:20px;
}

/* SUBCATEGORIES */
.sub {
  margin-bottom:50px;
}

.sub-title {
  font-size:1.2rem;
  margin-bottom:15px;
  color:#57534e;
}

/* LETTER GRID */
.letters {
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

@media(min-width:900px){
  .letters { grid-template-columns:1fr 1fr; }
}

.letter {
  background:rgba(255,255,255,0.8);
  border-radius:24px;
  padding:20px;
  backdrop-filter:blur(10px);
}

summary {
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  list-style:none;
}

summary::-webkit-details-marker { display:none; }

.summary-left {
  display:flex;
  gap:12px;
  align-items:center;
}

.emoji { font-size:1.6rem; }

.title { font-weight:500; }

.content {
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.letter-image {
  width:100%;
  border-radius:16px;
  margin-top:10px;
}

/* UPLOAD */
.upload {
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.upload input {
  font-size:0.8rem;
}

/* BUTTONS */
.controls {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

button {
  padding:8px 14px;
  border:none;
  border-radius:999px;
  background:white;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

/* FOOTER */
.footer {
  text-align:center;
  margin-top:80px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="layer">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
</div>

<div class="container">

<div class="hero">
  <h1>Open When</h1>
  <div class="subtitle">A small place for the moments when the distance feels harder.</div>
</div>

<!-- THEME 1 -->
<div class="theme">
  <div class="theme-title">Distance Days</div>

  <div class="sub">
    <div class="sub-title">For Nancy</div>
    <div class="letters" id="nancy"></div>
  </div>

  <div class="sub">
    <div class="sub-title">For Patrick</div>
    <div class="letters" id="patrick"></div>
  </div>

  <div class="sub">
    <div class="sub-title">For Both</div>
    <div class="letters" id="both"></div>
  </div>
</div>

<div class="footer">
  Austria ↔ Costa Rica ✨
</div>

</div>

<script>

const data = {
  nancy: [
    {title:'Open when you miss me', emoji:'💌', images:['missme1.jpeg','missme2.jpeg']},
    {title:'Open when you feel lonely', emoji:'🌙', images:['lonely1.jpeg','lonely2.jpeg']},
    {title:'Open when you need reassurance', emoji:'🤍', images:['reassure1.jpeg','reassure2.jpeg']},
    {title:'Open when you can’t sleep', emoji:'✨', images:['sleep1.jpeg','sleep2.jpeg']},
    {title:'Open when you want to smile', emoji:'☀️', images:['smile1.jpeg','smile2.jpeg']},
    {title:'Open when we have a difficult day', emoji:'🫶', images:['difficult1.jpeg','difficult2.jpeg']}
  ],
  patrick: [],
  both: []
};

/* store uploads in memory */
const uploads = {};

function render(id, list){

  const container = document.getElementById(id);

  list.forEach((l,i)=>{

    let idx = 0;

    const el = document.createElement('details');
    el.className='letter';

    uploads[`${id}-${i}`] = [];

    el.innerHTML=`
      <summary>
        <div class="summary-left">
          <div class="emoji">${l.emoji}</div>
          <div class="title">${l.title}</div>
        </div>
      </summary>

      <div class="content">

        <img class="letter-image" id="${id}-img-${i}" src="${l.images[0]}">

        <div class="controls">
          <button id="${id}-p-${i}">←</button>
          <button id="${id}-n-${i}">→</button>
        </div>

        <div class="upload">
          <input type="file" accept="image/*,video/*,audio/*" id="${id}-upload-${i}">
        </div>

      </div>
    `;

    container.appendChild(el);

    const img = document.getElementById(`${id}-img-${i}`);
    const p = document.getElementById(`${id}-p-${i}`);
    const n = document.getElementById(`${id}-n-${i}`);
    const up = document.getElementById(`${id}-upload-${i}`);

    function update(){
      img.src = l.images[idx];
    }

    p.onclick=()=>{ if(idx>0){ idx--; update(); } };
    n.onclick=()=>{ if(idx<l.images.length-1){ idx++; update(); } };

    up.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;

      const url = URL.createObjectURL(file);
      uploads[`${id}-${i}`].push(url);

      l.images.push(url);
      idx = l.images.length - 1;
      update();
    });

    update();

  });
}

render('nancy',data.nancy);
render('patrick',data.patrick);
render('both',data.both);

</script>

</body>
</html>
