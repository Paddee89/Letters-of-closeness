<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Open When</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top,#fff7ed,#fff1f2 40%,#fefce8);
  color:#44403c;
}

.container {
  max-width:900px;
  margin:auto;
  padding:60px 20px;
}

h1 {
  font-family:Cormorant Garamond;
  font-size:3rem;
  text-align:center;
}

.subtitle {
  text-align:center;
  color:#78716c;
  margin-bottom:40px;
}

/* THEMES */
.theme {
  background:rgba(255,255,255,0.75);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.theme:hover {
  transform:translateY(-2px);
}

/* VIEW */
#viewer {
  display:none;
  margin-top:30px;
}

.back {
  margin-bottom:20px;
  cursor:pointer;
  color:#78716c;
}

/* TABS */
.tabs {
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tab {
  padding:8px 14px;
  border-radius:999px;
  background:white;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.tab.active {
  background:#fde68a;
}

/* CARD */
.card {
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

img, video {
  width:100%;
  border-radius:12px;
  margin-top:10px;
}

/* UPLOAD */
.upload {
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Open When</h1>
<div class="subtitle">A small place for distance</div>

<!-- THEMES -->
<div id="themes"></div>

<!-- VIEW -->
<div id="viewer">

  <div class="back" onclick="closeViewer()">← Back</div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('nancy')">For Nancy</div>
    <div class="tab" onclick="switchTab('patrick')">For Patrick</div>
    <div class="tab" onclick="switchTab('both')">For Both</div>
  </div>

  <div class="card" id="content"></div>

</div>

</div>

<script>

const themes = [
  { id:"miss", title:"Open when you miss me" },
  { id:"lonely", title:"Open when you feel lonely" },
  { id:"reassure", title:"Open when you need reassurance" },
  { id:"sleep", title:"Open when you can't sleep" },
  { id:"smile", title:"Open when you want to smile" },
  { id:"hard", title:"Open when we have a difficult day" }
];

const state = {
  currentTheme:null,
  currentTab:"nancy"
};

/* STORAGE */
function getData(key){
  return JSON.parse(localStorage.getItem(key) || "[]");
}
function setData(key,val){
  localStorage.setItem(key, JSON.stringify(val));
}

/* RENDER THEMES */
const themesDiv = document.getElementById("themes");

themes.forEach(t=>{
  const el = document.createElement("div");
  el.className="theme";
  el.innerText=t.title;

  el.onclick=()=>openTheme(t);

  themesDiv.appendChild(el);
});

/* OPEN THEME */
function openTheme(theme){
  state.currentTheme = theme.id;
  document.getElementById("viewer").style.display="block";
  render();
}

/* CLOSE */
function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

/* TAB SWITCH */
function switchTab(tab){
  state.currentTab = tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

/* RENDER CONTENT */
function render(){

  const key = `${state.currentTheme}-${state.currentTab}`;
  const data = getData(key);

  const container = document.getElementById("content");

  container.innerHTML = `

    <div>
      <strong>${state.currentTheme} → ${state.currentTab}</strong>
    </div>

    <input type="file" multiple id="upload">

    <div id="media"></div>
  `;

  const media = document.getElementById("media");

  data.forEach(src=>{

    if(src.endsWith(".mp4")){
      media.innerHTML += `<video controls src="${src}"></video>`;
    }
    else{
      media.innerHTML += `<img src="${src}">`;
    }

  });

  document.getElementById("upload").onchange = (e)=>{

    const files = [...e.target.files];

    files.forEach(f=>{
      const url = URL.createObjectURL(f);
      data.push(url);
    });

    setData(key,data);
    render();
  };
}

</script>

</body>
</html>
