<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Open When</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top, #fff7ed, #fff1f2 40%, #fefce8);
  color:#44403c;
  overflow-x:hidden;
}

/* 🌿 PARALLAX LAYERS */
.layer {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* 🕯️ GLOW */
.glow {
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  filter:blur(100px);
  opacity:0.25;
  animation:flicker 6s infinite ease-in-out;
}

.glow-1 { background:#fecdd3; top:-120px; left:-120px; }
.glow-2 { background:#fde68a; bottom:-120px; right:-120px; animation-delay:2s; }
.glow-3 { background:white; top:40%; left:50%; transform:translate(-50%,-50%); opacity:0.12; animation-delay:1s; }

@keyframes flicker {
  0%,100% { opacity:0.18; transform:scale(1); }
  50% { opacity:0.3; transform:scale(1.08); }
}

/* LAYOUT (UNCHANGED) */
.container {
  position:relative;
  z-index:2;
  max-width:1000px;
  margin:0 auto;
  padding:80px 20px;
}

.hero {
  text-align:center;
  margin-bottom:60px;
}

h1 {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(3rem, 8vw, 6rem);
  font-weight:400;
}

.subtitle {
  margin-top:10px;
  color:#78716c;
}

/* CATEGORY */
.category-block {
  margin-bottom:70px;
}

.category-title {
  font-family:'Cormorant Garamond', serif;
  font-size:2rem;
  margin-bottom:20px;
}

/* LETTERS GRID */
.letters {
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

@media(min-width:900px){
  .letters { grid-template-columns:1fr 1fr; }
}

/* LETTER CARD */
.letter {
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

summary {
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  list-style:none;
}

summary::-webkit-details-marker { display:none; }

.summary-left {
  display:flex;
  gap:12px;
  align-items:center;
}

.emoji { font-size:1.6rem; }

.title { font-weight:500; }

/* ❌ open-gently removed (only change) */

.content {
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:15px;
}

/* IMAGE */
.letter-image {
  width:100%;
  border-radius:16px;
  margin-top:12px;
  opacity:0;
  transform:translateY(10px);
  transition:0.5s;
}

.letter-image.loaded {
  opacity:1;
  transform:translateY(0);
}

/* BUTTONS */
.controls {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.nav-button {
  padding:10px 16px;
  border:none;
  border-radius:999px;
  background:white;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

/* FOOTER (UNCHANGED) */
.footer {
  text-align:center;
  margin-top:80px;
  color:#aaa;
}

/* MOBILE */
@media(max-width:768px){
  .container { padding:60px 15px; }
}
</style>
</head>

<body>

<div class="layer" id="layer1">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
</div>

<div class="layer" id="layer2">
  <div class="glow glow-3"></div>
</div>

<div class="container">

  <div class="hero">
    <h1>Open When</h1>
    <div class="subtitle">A small place for distance.</div>
  </div>

  <div id="themes"></div>

</div>

<script>

const data = {
  missme: {
    nancy:['missme1.jpeg','missme2.jpeg'],
    patrick:['nanmissme1.jpeg','nanmissme2.jpeg'],
    both:['bothmissme1.jpeg','bothmissme2.jpeg']
  },
  lonely: {
    nancy:['lonely1.jpeg','lonely2.jpeg'],
    patrick:['nanlonely1.jpeg','nanlonely2.jpeg'],
    both:['bothlonely1.jpeg','bothlonely2.jpeg']
  },
  reassure: {
    nancy:['reassure1.jpeg','reassure2.jpeg'],
    patrick:['nanreassure1.jpeg','nanreassure2.jpeg'],
    both:['bothreassure1.jpeg','bothreassure2.jpeg']
  },
  sleep: {
    nancy:['sleep1.jpeg','sleep2.jpeg'],
    patrick:['nansleep1.jpeg','nansleep2.jpeg'],
    both:['bothsleep1.jpeg','bothsleep2.jpeg']
  },
  smile: {
    nancy:['smile1.jpeg','smile2.jpeg'],
    patrick:['nansmile1.jpeg','nansmile2.jpeg'],
    both:['bothsmile1.jpeg','bothsmile2.jpeg']
  },
  difficult: {
    nancy:['difficult1.jpeg','difficult2.jpeg'],
    patrick:['nandifficult1.jpeg','nandifficult2.jpeg'],
    both:['bothdifficult1.jpeg','bothdifficult2.jpeg']
  }
};

const labels = {
  missme:"When you miss me",
  lonely:"When you feel lonely",
  reassure:"When you need reassurance",
  sleep:"When you can't sleep",
  smile:"When you want to smile",
  difficult:"When we have a difficult day"
};

const container = document.getElementById("themes");

/* ONLY CHANGE: SUBCATEGORY SELECTOR */
Object.keys(data).forEach(theme=>{

  const block = document.createElement("div");
  block.className="category-block";

  block.innerHTML = `
    <div class="category-title">${labels[theme]}</div>
    <div class="letters" id="box-${theme}">
      <div data-person="nancy">For Nancy</div>
      <div data-person="patrick">For Patrick</div>
      <div data-person="both">For Both</div>
    </div>
  `;

  container.appendChild(block);

  block.querySelectorAll("[data-person]").forEach(el=>{
    el.onclick=()=>open(theme, el.dataset.person);
  });

});

function open(theme, person){

  const files = data[theme][person];

  document.body.innerHTML = `
  <div class="container">
    <h2 onclick="location.reload()" style="cursor:pointer;">← Back</h2>
    <div id="view"></div>
  </div>`;

  const view = document.getElementById("view");

  files.forEach(img=>{
    const el=document.createElement("div");
    el.className="letter";
    el.innerHTML=`<img class="letter-image" src="${img}">`;
    view.appendChild(el);
  });

}

/* PARALLAX (UNCHANGED) */
document.addEventListener('mousemove',(e)=>{
  const x=(e.clientX/window.innerWidth-0.5)*20;
  const y=(e.clientY/window.innerHeight-0.5)*20;

  document.getElementById('layer1').style.transform=`translate(${x}px,${y}px)`;
  document.getElementById('layer2').style.transform=`translate(${-x}px,${-y}px)`;
});

</script>

</body>
</html>
